plugins {
    id "com.android.application"
}

android {
    namespace "io.rea.obd"
    compileSdk 35

    defaultConfig {
        applicationId "io.rea.obd"
        minSdk 26
        targetSdk 35
        versionCode 25
        versionName "1.2.0"
    }

    def keystoreFile = rootProject.file("keystore.properties")
    if (keystoreFile.exists()) {
        def keystore = new Properties()
        keystoreFile.withInputStream { keystore.load(it) }
        signingConfigs {
            release {
                storeFile file(keystore["storeFile"])
                storePassword keystore["storePassword"]
                keyAlias keystore["keyAlias"]
                keyPassword keystore["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".teste"
            versionNameSuffix "-teste"
            manifestPlaceholders = [appLabel: "BorbaCar Labs (teste)"]
        }
        release {
            manifestPlaceholders = [appLabel: "BorbaCar Labs"]
            minifyEnabled false
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty "screenshots.update", project.hasProperty("updateScreenshots")
                inputs.dir "src/test/screenshots"
            }
        }
    }

    lint {
        disable "SetTextI18n"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.17"
    testImplementation "org.json:json:20260814"
}
