name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: APK de release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Certificado
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sem certificado configurado: o APK sai sem assinatura."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Testar e gerar o APK
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          name="BorbaCar-Labs-${GITHUB_REF_NAME#v}.apk"
          cp "$apk" "$name"
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v" " {p=1; next} /^## / {p=0} p' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "$name" --title "BorbaCar Labs ${GITHUB_REF_NAME#v}" --notes "${notes:-Versão ${GITHUB_REF_NAME#v}}"

      - name: Limpar certificado
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
