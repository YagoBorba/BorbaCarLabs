name: Android

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, testes e lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar, testar e analisar
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace

      - name: Relatório dos testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testes
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Relatório do lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint
          path: app/build/reports/lint-results-debug.html

      - name: Capturas das telas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telas
          path: app/build/screenshots/

      - name: APK de teste
        uses: actions/upload-artifact@v7
        with:
          name: apk-teste
          path: app/build/outputs/apk/debug/app-debug.apk

  server:
    name: Servidor de IA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Sintaxe
        run: node --check server.mjs
      - name: Testes
        run: npm test
